# Lint, typecheck, and unit + integration tests on every push and pull request.
#
# The services mirror docker-compose.yml, so the tests see exactly what they see locally:
# PostGIS on 127.0.0.1:54329 (user mira / mira_local_dev, a local-only test credential,
# not a secret) and Mailpit on 1025 (SMTP) and 8025 (API). The integration tests use the
# mira_test database (tests/setup/test-env.ts), created by db/init/01-databases.sql.
#
# End-to-end tests (npm run test:e2e) are NOT run here: they need a production build,
# Playwright browsers and about 10 minutes of serial runs. Run them locally before
# opening a pull request that touches a protected area (see CONTRIBUTING.md).

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_USER: mira
          POSTGRES_PASSWORD: mira_local_dev
          POSTGRES_DB: mira
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U mira -d mira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        env:
          MP_MAX_MESSAGES: 500
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
          MP_SMTP_DISABLE_RDNS: 1
        ports:
          - 1025:1025
          - 8025:8025

    env:
      TEST_DATABASE_URL: postgres://mira:mira_local_dev@127.0.0.1:54329/mira_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Service containers start before checkout, so db/init can't be mounted as it is in
      # docker-compose.yml. Run the same SQL against the running database instead.
      - name: Create test databases
        env:
          PGPASSWORD: mira_local_dev
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54329 -U mira -d mira -f db/init/01-databases.sql

      - name: Wait for Mailpit
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8025/api/v1/info > /dev/null && exit 0
            sleep 1
          done
          echo "Mailpit did not become ready" >&2
          exit 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test
